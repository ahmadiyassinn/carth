@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#F4F2EC;--paper:#0A0A0A;--pure:#141413;--ink2:#C9C7BF;--mute:#9A9890;--rule:#2A2A27;--acc:#F97316}}
:root[data-theme=dark]{--ink:#F4F2EC;--paper:#0A0A0A;--pure:#141413;--ink2:#C9C7BF;--mute:#9A9890;--rule:#2A2A27;--acc:#F97316}
:root:lang(ar){--serif:Amiri,"Times New Roman",serif;--sans:"IBM Plex Sans Arabic",Tahoma,sans-serif}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.55 var(--sans)}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.skip{position:absolute;inset-inline-start:8px;top:-60px;background:var(--ink);color:var(--paper);padding:10px 14px;z-index:20}.skip:focus{top:8px}
.wrap{max-width:1360px;margin-inline:auto;padding-inline:16px}
@media(min-width:760px){.wrap{padding-inline:24px}}
.lg{display:block;height:var(--h);width:calc(var(--h)*var(--ar));background:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:10px}
.bar .lg{--h:26px;opacity:0;transition:opacity .35s}.bar.on .lg{opacity:1}
.bar nav{order:3;display:flex;gap:20px;overflow-x:auto;white-space:nowrap;width:100%;font-weight:500;font-size:.95rem}
.bar nav a{text-decoration:none;color:var(--ink2)}.bar nav a:hover{color:var(--acc)}
.tools{margin-inline-start:auto;display:flex;align-items:center;gap:14px}
.lang{display:flex;gap:2px}.lang button{border:0;background:none;color:var(--mute);font:600 .8rem var(--sans);padding:8px 6px;cursor:pointer}.lang button[aria-pressed=true]{color:var(--ink);text-decoration:underline;text-underline-offset:5px}
@media(min-width:900px){.bar nav{order:0;width:auto;margin-inline-start:12px}}
.btn{display:inline-block;padding:13px 22px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font:600 .9rem/1 var(--sans);text-decoration:none;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.btn:hover{background:var(--acc);border-color:var(--acc);color:#fff}.btn.o{background:none;color:inherit;border-color:currentColor}.btn.o:hover{background:var(--acc);color:#fff;border-color:var(--acc)}
.mast{margin:0;padding-block:28px 12px}.mast .lg{--h:min(calc((100vw - 32px)/var(--ar)),250px)}
.tag{margin:0 0 20px;font:italic 400 clamp(1.2rem,2.2vw,1.7rem)/1.3 var(--serif);color:var(--ink2)}
.tk{border-block:1px solid var(--rule);overflow:hidden;white-space:nowrap;font-size:.85rem;font-weight:500;direction:ltr}
.tk div{display:inline-block;animation:mq 45s linear infinite}.tk span{display:inline-block;padding:11px 28px;border-inline-start:1px solid var(--rule)}
@keyframes mq{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.tk div{animation:none}html{scroll-behavior:auto}.bar .lg,.btn{transition:none}}
.t0{--c1:#E9DCC9;--c2:#C2410C}.t1{--c1:#0A0A0A;--c2:#E9DCC9}.t2{--c1:#D9D4C7;--c2:#3A3A37}.t3{--c1:#C2410C;--c2:#FAFAF8}.t4{--c1:#1F2A44;--c2:#E9DCC9}
.ph{position:relative;overflow:hidden;aspect-ratio:var(--r,4/5);background:var(--c1)}
.ph::after{content:"";position:absolute;inset-inline:24%;bottom:0;height:60%;background:var(--c2);border-radius:999px 999px 0 0;transition:transform .5s}
.ph::before{content:"";position:absolute;top:12%;inset-inline-end:12%;width:13%;aspect-ratio:1;border-radius:50%;background:var(--c2)}
.card{display:block;text-decoration:none}.card:hover .ph::after{transform:translateY(-4%)}.card:hover h3,.card:hover h2{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px}
.cat{margin:14px 0 4px;font-weight:600;font-size:.85rem;color:var(--acc)}
.card h3{margin:0 0 8px;font:400 1.55rem/1.15 var(--serif)}
.mt{margin:0;color:var(--mute);font-size:.85rem}
:lang(ar) h2,:lang(ar) h3{letter-spacing:0;line-height:1.4}
.hero{display:grid;gap:28px;padding-block:20px 8px}
.hero h2{margin:0 0 12px;font:400 clamp(2.4rem,5.4vw,4.6rem)/1 var(--serif);letter-spacing:-.02em}
.dek{margin:0 0 14px;font:italic 400 clamp(1.2rem,2vw,1.5rem)/1.35 var(--serif);color:var(--ink2);max-width:36em}
.side{display:grid;gap:20px;align-content:start}.side .card{display:grid;grid-template-columns:104px 1fr;gap:16px;padding-top:20px;border-top:1px solid var(--rule)}.side .cat{margin-top:0}.side h3{font-size:1.3rem}
@media(min-width:900px){.hero{grid-template-columns:8fr 4fr;gap:40px}}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:16px;border-top:1px solid var(--ink);padding-top:14px;margin:64px 0 28px}
.sh h2{margin:0;font:400 clamp(1.9rem,3.2vw,2.9rem)/1.1 var(--serif)}.sh a{font-weight:500;font-size:.95rem}
.g4{display:grid;gap:36px 24px}
@media(min-width:640px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.g4{grid-template-columns:repeat(4,1fr)}.g4>:nth-child(even){margin-top:44px}}
.bw{background:var(--ink);color:var(--paper);margin-top:72px;padding-block:56px}
.bw .in{display:grid;gap:36px;align-items:center}.bw h2{margin:6px 0 16px;font:400 clamp(2.6rem,7vw,6rem)/.95 var(--serif);letter-spacing:-.03em}
.bw .k{font-weight:600;font-size:.9rem;opacity:.75}.bw q{display:block;max-width:26em;margin-bottom:28px;font:italic 400 1.5rem/1.35 var(--serif);quotes:none}
.bw .btn{background:var(--paper);color:var(--ink);border-color:var(--paper);margin-inline-end:10px}.bw .btn.o{background:none;color:var(--paper)}
.bw .tri{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.bw .tri .ph{--r:3/4}
@media(min-width:900px){.bw .in{grid-template-columns:1fr 1fr;gap:64px}}
:lang(ar) .bw h2{letter-spacing:0;line-height:1.2}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:20px}
.chip{border:1px solid var(--rule);background:none;color:inherit;padding:8px 16px;border-radius:999px;font:500 .9rem var(--sans);cursor:pointer;transition:background .2s}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#cnt{margin-inline-start:auto;color:var(--mute);font-size:.9rem}
.bg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.bc{background:var(--pure);padding:22px;display:grid;gap:16px;text-decoration:none}.bc:hover{background:var(--paper)}
.lo{width:56px;aspect-ratio:1;display:grid;place-items:center;background:var(--ink);color:var(--paper);font:400 1.9rem/1 var(--serif)}
.bc b{display:block;font:400 1.45rem/1.15 var(--serif)}.bc small{color:var(--mute);font-size:.85rem}
.nl{border-top:1px solid var(--ink);margin-top:72px;padding-block:48px;display:grid;gap:24px}
.nl h2{margin:0 0 8px;font:400 clamp(1.9rem,3.2vw,2.9rem)/1.1 var(--serif)}.nl p{margin:0;color:var(--ink2);max-width:30em}
@media(min-width:900px){.nl{grid-template-columns:1fr 1fr;align-items:end;gap:64px}}
.nl form{display:flex;gap:12px;flex-wrap:wrap}
.nl input{flex:1 1 220px;min-width:0;border:0;border-bottom:1px solid var(--ink);border-radius:0;background:none;color:inherit;font:inherit;padding:13px 0}
#st{min-height:1.5em;margin-top:10px;font-size:.9rem;color:var(--acc)}
.ft{border-top:1px solid var(--rule);margin-top:24px;padding-block:40px 28px}
.ft .lg{--h:min(calc((min(100vw - 32px,640px))/var(--ar)),270px)}
.ft nav{display:flex;flex-wrap:wrap;gap:10px 28px;margin:28px 0 20px}.ft nav a{text-decoration:none;font-weight:500}.ft nav a:hover{color:var(--acc)}
.ft p{margin:0;color:var(--mute);font-size:.85rem}
</style>
</head>

</div>
<script>
const $=s=>document.querySelector(s),R=document.documentElement;
const L={

const ST=[["fa",7,"Yasmine B."],["be",5,"Omar K."],["mu",4,"Lina T."],["fo",6,"Omar K."],["ar",8,"Yasmine B."],["vo",5,"Lina T."],["fa",6,"Omar K."]];
const BR=[["Atelier Nour","sf","fa"],["Kahwa Club","so","fo"],["Bled Ceramics","nb","ar"],["Nawwar Skin","tu","be"],["Jerid Sound","to","mu"],["Studio Sidi","tu","ar"]];
let lang="en",cat="all";
try{const n=(navigator.language||"en").slice(0,2);lang=["fr","ar"].includes(n)?n:"en";lang=localStorage.getItem("carth-lang")||lang}catch(e){}
const meta=(i,l)=>`<p class="mt">${l.by} <bdi>${ST[i][2]}</bdi>, ${ST[i][1]} ${l.min}</p>`;
const card=(i,l)=>`<a class="card" href="#"><div class="ph t${i%5}"></div><p class="cat">${l.cats[ST[i][0]]}</p><h3>${l.s[i][0]}</h3>${meta(i,l)}</a>`;
function render(){
const l=L[lang];R.lang=lang;R.dir=lang=="ar"?"rtl":"ltr";
document.querySelectorAll("[data-i]").forEach(e=>e.textContent=l[e.dataset.i]);
document.querySelectorAll("[data-p]").forEach(e=>e.placeholder=l[e.dataset.p]);
document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l==lang));
$("#nav").innerHTML=l.nav.map((n,i)=>`<a href="#${["latest","index","index","latest","news"][i]}">${n}</a>`).join("");

const f=BR.filter(b=>cat=="all"||b[2]==cat);$("#cnt").textContent=l.brands+": "+f.length;

document.addEventListener("click",e=>{

});
